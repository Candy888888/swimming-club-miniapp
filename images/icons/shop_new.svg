<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g>
    <!-- 会员卡 -->
    <rect x="25" y="30" width="50" height="35" rx="5" ry="5" fill="#3498DB" />
    
    <!-- 会员卡标题 -->
    <rect x="30" y="35" width="40" height="8" rx="2" ry="2" fill="white" opacity="0.7" />
    <text x="50" y="41" font-family="Arial" font-size="6" text-anchor="middle" fill="#2874A6">MEMBER</text>
    
    <!-- 会员头像占位 -->
    <circle cx="40" cy="50" r="8" fill="white" opacity="0.7" />
    <circle cx="40" cy="48" r="4" fill="#3498DB" />
    <path d="M32 58 C32 54, 48 54, 48 58" fill="white" opacity="0.7" />
    
    <!-- 会员信息线条 -->
    <line x1="55" y1="48" x2="70" y2="48" stroke="white" stroke-width="2" opacity="0.7" />
    <line x1="55" y1="53" x2="65" y2="53" stroke="white" stroke-width="2" opacity="0.7" />
    
    <!-- 会员卡底部 -->
    <rect x="30" y="60" width="40" height="2" rx="1" ry="1" fill="white" opacity="0.7" />
  </g>
</svg>