<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g>
    <!-- 时钟外圈 -->
    <circle cx="50" cy="40" r="20" fill="none" stroke="#3498DB" stroke-width="3" />
    
    <!-- 时钟指针 -->
    <line x1="50" y1="40" x2="50" y2="25" stroke="#3498DB" stroke-width="2" />
    <line x1="50" y1="40" x2="60" y2="45" stroke="#3498DB" stroke-width="2" />
    <circle cx="50" cy="40" r="2" fill="#3498DB" />
    
    <!-- 水滴 -->
    <path d="M45 55 C45 60, 55 60, 55 55 L50 45 Z" fill="#3498DB" />
    
    <!-- 游泳者 -->
    <path d="M60 70 C65 65, 70 70, 75 65" stroke="#3498DB" stroke-width="3" fill="none" />
    <circle cx="60" cy="60" r="5" fill="#3498DB" />
    
    <!-- 水波纹 -->
    <path d="M25 80 C35 75, 45 85, 55 80 C65 75, 75 85, 85 80" stroke="#3498DB" stroke-width="3" fill="none" />
  </g>
</svg>