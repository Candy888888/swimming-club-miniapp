<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g>
    <!-- 书架背景 -->
    <rect x="20" y="20" width="60" height="60" fill="#E8F6F3" stroke="#3498DB" stroke-width="2" />
    
    <!-- 顶部横线 -->
    <line x1="20" y1="25" x2="80" y2="25" stroke="#3498DB" stroke-width="2" />
    
    <!-- 底部横线 -->
    <line x1="20" y1="75" x2="80" y2="75" stroke="#3498DB" stroke-width="2" />
    
    <!-- 书本1 - 蓝色 -->
    <rect x="25" y="30" width="10" height="40" fill="#3498DB" />
    <line x1="30" y1="35" x2="30" y2="65" stroke="white" stroke-width="1" />
    
    <!-- 书本2 - 深蓝色 -->
    <rect x="40" y="30" width="10" height="40" fill="#2874A6" />
    <line x1="45" y1="35" x2="45" y2="65" stroke="white" stroke-width="1" />
    
    <!-- 书本3 - 浅蓝色 -->
    <rect x="55" y="30" width="10" height="40" fill="#85C1E9" />
    <line x1="60" y1="35" x2="60" y2="65" stroke="white" stroke-width="1" />
    
    <!-- 书本4 - 中蓝色 -->
    <rect x="70" y="30" width="5" height="40" fill="#5DADE2" />
    <line x1="72.5" y1="35" x2="72.5" y2="65" stroke="white" stroke-width="1" />
  </g>
</svg>