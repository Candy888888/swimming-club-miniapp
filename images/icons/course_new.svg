<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g>
    <!-- 日历外框 -->
    <rect x="20" y="20" width="60" height="60" rx="5" ry="5" fill="#E8F6F3" stroke="#117A65" stroke-width="3" />
    
    <!-- 日历顶部 -->
    <rect x="20" y="20" width="60" height="15" rx="5" ry="5" fill="#117A65" />
    
    <!-- 日历挂钩 -->
    <rect x="35" y="15" width="5" height="10" rx="2" ry="2" fill="#34495E" />
    <rect x="60" y="15" width="5" height="10" rx="2" ry="2" fill="#34495E" />
    
    <!-- 日历内容 -->
    <line x1="35" y1="50" x2="65" y2="50" stroke="#2E86C1" stroke-width="3" />
    <line x1="35" y1="60" x2="55" y2="60" stroke="#2E86C1" stroke-width="3" />
  </g>
</svg>